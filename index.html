<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Veenza Drinking Water Pvt. Ltd.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
      color: #000;
    }

    header {
      background-color: #0099ff;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header img {
      height: 60px;
      border-radius: 50%;
    }

    nav input {
      padding: 5px;
      width: 300px;
      font-size: 16px;
    }

    .container {
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .product h3 {
      margin-top: 0;
    }

    .product button {
      background-color: #0099ff;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    .bill {
      margin-top: 30px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    form input,
    form textarea,
    form select,
    form button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    form button {
      background-color: #0099ff;
      color: white;
      border: none;
      cursor: pointer;
    }

    form button:hover {
      background-color: #007acc;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      padding: 20px;
      background-color: #000;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <div><img src="logo.png" alt="Logo" /></div>
    <h1>Veenza Drinking Water Pvt. Ltd.</h1>
    <nav><input type="text" placeholder="Search..." /></nav>
  </header>

  <div class="container">
    <h2>Our Products</h2>
    <div class="products" id="product-list"></div>

    <div class="bill" id="bill" style="display:none">
      <h2>Order Summary</h2>
      <table width="100%" border="1" cellpadding="10">
        <thead>
          <tr>
            <th>Product</th>
            <th>Cartons</th>
            <th>Price/Carton</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="bill-body"></tbody>
      </table>
      <h3 id="grand-total"></h3>
    </div>

    <h2>फॉर्म भरें:</h2>
    <form onsubmit="event.preventDefault(); sendData();">
      <input type="text" id="name" placeholder="नाम" required />
      <input type="email" id="email" placeholder="ईमेल" required />
      <input type="text" id="mobile" placeholder="मोबाइल नंबर" required />
      <textarea id="address" placeholder="पूरा पता" required></textarea>
      <input type="url" id="pdfLink" placeholder="PDF लिंक (Google Drive)" />
      <button type="submit">सबमिट करें</button>
    </form>
  </div>

  <footer>
    <p>Pure Water, Healthy Life</p>
    <p>Govindgarh, Pushkar ke pass, Ajmer - 305201</p>
    <p>Follow us on: [Social Media Links]</p>
  </footer>

  <script>
    const products = [
      { name: '250ml Bottle', price: 5 * 12 },
      { name: '500ml Bottle', price: 7 * 12 },
      { name: '1L Bottle', price: 8 * 12 },
      { name: '5L Jar', price: 10 * 12 },
      { name: '10L Jar', price: 15 * 12 },
    ];

    const productList = document.getElementById('product-list');
    const cart = [];

    function updateBill() {
      const billDiv = document.getElementById('bill');
      const billBody = document.getElementById('bill-body');
      const grandTotal = document.getElementById('grand-total');

      billBody.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const row = `<tr><td>${item.name}</td><td>${item.qty}</td><td>₹${item.price}</td><td>₹${item.price * item.qty}</td></tr>`;
        total += item.price * item.qty;
        billBody.innerHTML += row;
      });

      grandTotal.innerText = 'Grand Total: ₹' + total;
      billDiv.style.display = 'block';
    }

    products.forEach((product, index) => {
      const div = document.createElement('div');
      div.className = 'product';
      div.innerHTML = `
        <h3>${product.name}</h3>
        <p>₹${product.price} per carton (12 bottles)</p>
        <label>Cartons: <input type='number' min='4' value='4' id='qty-${index}'></label>
        <button onclick='addToCart(${index})'>Add to Cart</button>
      `;
      productList.appendChild(div);
    });

    function addToCart(index) {
      const qty = parseInt(document.getElementById(`qty-${index}`).value);
      if (qty >= 4) {
        cart.push({ ...products[index], qty });
        alert(`${products[index].name} added to cart with ${qty} cartons`);
        updateBill();
      } else {
        alert("Minimum order is 4 cartons");
      }
    }

    function sendData() {
      const url = "https://script.google.com/macros/s/AKfycbxfbuF4bD6AWAmM1C2wc_kuWt5_OXB10MIoHgARa03ppD20qc2l4SlMMIgFVijlOsxw/exec";

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        mobile: document.getElementById("mobile").value,
        address: document.getElementById("address").value,
        pdfLink: document.getElementById("pdfLink").value,
        cart: cart.map(item => ({
          name: item.name,
          qty: item.qty,
          price: item.price,
          total: item.qty * item.price
        }))
      };

      fetch(url, {
        method: "POST",
        body: JSON.stringify(data),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then(res => res.text())
      .then(msg => {
        alert(msg || "ऑर्डर सफलतापूर्वक भेजा गया!");
        document.querySelector("form").reset();
        document.getElementById("bill").style.display = "none";
      })
      .catch(err => {
        console.error(err);
        alert("डेटा भेजने में त्रुटि हुई। कृपया फिर से प्रयास करें।");
      });
    }
  </script>

</body>
</html>
