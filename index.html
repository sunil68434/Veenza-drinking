<!DOCTYPE html><html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Veenza Order Form</title>
</head>
<body>
  <h2>Veenza Drinking Water - ऑर्डर फॉर्म</h2>  <form onsubmit="event.preventDefault(); submitOrder();">
    <input type="text" id="name" placeholder="नाम" required><br><br>
    <input type="text" id="mobile" placeholder="मोबाइल नंबर" required><br><br>
    <textarea id="address" placeholder="पूरा पता" required></textarea><br><br><strong>प्रोडक्ट चुनें:</strong><br>
<label><input type="checkbox" name="product" value="1L Bottle - ₹20"> 1L Bottle - ₹20</label><br>
<label><input type="checkbox" name="product" value="20L Jar - ₹40"> 20L Jar - ₹40</label><br>
<label><input type="checkbox" name="product" value="5L Can - ₹60"> 5L Can - ₹60</label><br><br>

<button type="submit">Order Now</button>

  </form>  <script>
    function submitOrder() {
      const name = document.getElementById("name").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const address = document.getElementById("address").value.trim();

      const products = Array.from(document.querySelectorAll('input[name="product"]:checked'))
        .map(p => p.value)
        .join(", ");

      if (!products) {
        alert("कृपया कम से कम एक प्रोडक्ट चुनें।");
        return;
      }

      fetch("https://script.google.com/macros/s/AKfycbxfbuF4bD6AWAmM1C2wc_kuWt5_OXB10MIoHgARa03ppD20qc2l4SlMMIgFVijlOsxw/exec", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, mobile, address, products })
      })
      .then(res => res.text())
      .then(msg => {
        alert("✅ ऑर्डर सफलतापूर्वक भेज दिया गया है!");
        document.querySelector("form").reset();
      })
      .catch(err => alert("❌ कुछ गलती हुई: " + err));
    }
  </script></body>
</html>
