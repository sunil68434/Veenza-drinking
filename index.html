<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veenza Drinking Water Pvt. Ltd.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            color: #000;
        }
        header {
            background-color: #0099ff;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header img {
            height: 60px;
            border-radius: 50%;
        }
        nav input {
            padding: 5px;
            width: 300px;
            font-size: 16px;
        }
        .container {
            padding: 20px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .product {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .product h3 {
            margin-top: 0;
        }
        .product button {
            background-color: #0099ff;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .checkout-form {
            margin-top: 40px;
        }
        .checkout-form input, .checkout-form select {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 100%;
        }
        footer {
            margin-top: 50px;
            text-align: center;
            padding: 20px;
            background-color: #000;
            color: white;
        }
    </style>
</head><body>
    <header>
        <div><img src="logo.png" alt="Logo"></div>
        <h1>Veenza Drinking Water Pvt. Ltd.</h1>
        <nav>
            <input type="text" placeholder="Search...">
        </nav>
    </header><div class="container">
    <h2>Our Products</h2>
    <div class="products" id="product-list"></div>

    <h2>Checkout</h2>
    <form class="checkout-form" id="checkout-form">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="tel" name="mobile" placeholder="Mobile Number" required>
        <input type="text" name="address" placeholder="Full Address" required>
        <select name="payment" required>
            <option value="">Select Payment Method</option>
            <option value="card">Credit/Debit Card</option>
            <option value="upi">UPI</option>
            <option value="cod">Cash on Delivery</option>
        </select>
        <button type="submit">Place Order</button>
    </form>
</div>

<footer>
    <p>Pure Water, Healthy Life</p>
    <p>Govindgarh, Pushkar ke pass, Ajmer - 305201</p>
    <p>Follow us on: [Social Media Links]</p>
</footer>

<script>
    const products = [
        { name: '250ml Bottle', price: 5 },
        { name: '500ml Bottle', price: 7 },
        { name: '1L Bottle', price: 8 },
        { name: '5L Jar', price: 10 },
        { name: '10L Jar', price: 15 },
    ];

    const productList = document.getElementById('product-list');
    const cart = [];

    products.forEach((product, index) => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
            <h3>${product.name}</h3>
            <p>₹${product.price} per unit</p>
            <label>Qty: <input type='number' min='100' value='100' id='qty-${index}'></label>
            <button onclick='addToCart(${index})'>Add to Cart</button>
        `;
        productList.appendChild(div);
    });

    function addToCart(index) {
        const qty = parseInt(document.getElementById(`qty-${index}`).value);
        if (qty >= 100) {
            cart.push({ ...products[index], qty });
            alert(`${products[index].name} added to cart with qty ${qty}`);
        } else {
            alert("Minimum quantity is 100");
        }
    }

    document.getElementById('checkout-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const data = new FormData(e.target);
        const details = Object.fromEntries(data.entries());
        let csv = 'Product,Qty,Price\n';
        cart.forEach(item => {
            csv += `${item.name},${item.qty},${item.price * item.qty}\n`;
        });
        csv += `\nName,${details.name}\nEmail,${details.email}\nPhone,${details.mobile}\nAddress,${details.address}\nPayment,${details.payment}`;

        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'veenaza-order.csv';
        link.click();

        alert('Order placed successfully! CSV saved.');
    });
</script>

</body></html>
