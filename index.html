<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veenza Drinking Water</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #e6f7ff;
      color: #000;
    }
    header {
      background-color: #000;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      border-radius: 50%;
      height: 60px;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
    }
    .tagline {
      text-align: center;
      font-size: 20px;
      margin: 10px 0;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
    }
    .product {
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 250px;
      margin: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .product h3 {
      margin: 10px 0;
    }
    .cart-btn, .checkout-btn {
      background-color: #00aaff;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .quantity-input {
      width: 60px;
      margin: 5px;
    }
    footer {
      text-align: center;
      padding: 10px;
      background: #000;
      color: white;
      margin-top: 20px;
    }
    .feedback-form, .checkout {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }
  </style>
</head>
<body><header>
  <img src="logo.png" alt="Veenza Logo" class="logo">
  <div class="title">Veenza Drinking Water Private Limited Company</div>
</header><div class="tagline">Pure Water, Healthy Life</div><div class="products">
  <div class="product">
    <h3>250ml Bottle</h3>
    <p>Price: ₹5</p>
    <input type="number" class="quantity-input" min="100" value="100" id="qty250">
    <button class="cart-btn" onclick="addToCart('250ml', 5, 'qty250')">Add to Cart</button>
  </div>
  <div class="product">
    <h3>500ml Bottle</h3>
    <p>Price: ₹7</p>
    <input type="number" class="quantity-input" min="100" value="100" id="qty500">
    <button class="cart-btn" onclick="addToCart('500ml', 7, 'qty500')">Add to Cart</button>
  </div>
  <div class="product">
    <h3>1L Bottle</h3>
    <p>Price: ₹8</p>
    <input type="number" class="quantity-input" min="100" value="100" id="qty1L">
    <button class="cart-btn" onclick="addToCart('1L', 8, 'qty1L')">Add to Cart</button>
  </div>
  <div class="product">
    <h3>5L Jar</h3>
    <p>Price: ₹10</p>
    <input type="number" class="quantity-input" min="100" value="100" id="qty5L">
    <button class="cart-btn" onclick="addToCart('5L', 10, 'qty5L')">Add to Cart</button>
  </div>
  <div class="product">
    <h3>10L Jar</h3>
    <p>Price: ₹15</p>
    <input type="number" class="quantity-input" min="100" value="100" id="qty10L">
    <button class="cart-btn" onclick="addToCart('10L', 15, 'qty10L')">Add to Cart</button>
  </div>
</div><div class="checkout">
  <h2>Checkout</h2>
  <p><strong>Items:</strong></p>
  <div id="cartList"></div>
  <label for="payment">Select Payment Method:</label>
  <select id="payment">
    <option value="">--Choose Payment Method--</option>
    <option value="Card">Card</option>
    <option value="UPI">UPI</option>
    <option value="COD">Cash on Delivery</option>
  </select>
  <br><br>
  <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
</div><div class="feedback-form">
  <h2>Feedback</h2>
  <form action="https://formspree.io/f/xeqybpbg" method="POST">
    <label>Name:</label><br>
    <input type="text" name="name" required><br>
    <label>Email:</label><br>
    <input type="email" name="email" required><br>
    <label>Message:</label><br>
    <textarea name="message" rows="5" required></textarea><br><br>
    <button class="cart-btn" type="submit">Submit</button>
  </form>
</div><footer>
  &copy; 2025 Veenza. All rights reserved. | Social Media: [Add here]
</footer><script>
  const cart = [];

  function addToCart(name, price, qtyId) {
    const qty = document.getElementById(qtyId).value;
    cart.push({ name, qty, price });
    alert(name + ' added to cart!');
    updateCartList();
  }

  function updateCartList() {
    const cartList = document.getElementById("cartList");
    cartList.innerHTML = cart.map(item => `<p>${item.name} x ${item.qty} = ₹${item.qty * item.price}</p>`).join('');
  }

  function checkout() {
    const method = document.getElementById("payment").value;
    if (!method) {
      alert("Please select a payment method.");
    } else {
      alert("Thank you for your order! Payment Method: " + method);
    }
  }
</script></body>
</html>
