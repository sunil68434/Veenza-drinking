<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veenza Drinking Water Pvt. Ltd.</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0099ff;
      color: white;
      padding: 10px 20px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
    }
    .header-left img {
      height: 50px;
      margin-right: 10px;
    }
    .company-info h1 {
      font-size: 18px;
      margin: 0;
    }
    .company-info p {
      margin: 2px 0;
      font-size: 12px;
    }
    .menu-icon {
      font-size: 24px;
      cursor: pointer;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      right: 20px;
      background-color: #007acc;
      z-index: 1;
      border-radius: 5px;
    }
    .dropdown-content a {
      display: block;
      color: white;
      padding: 10px;
      text-decoration: none;
    }
    .dropdown-content a:hover {
      background-color: #005f99;
    }
    .whatsapp-button {
      background-color: #25D366;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      margin-top: 5px;
      display: inline-block;
    }
    .container {
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="logo.png" alt="Logo" />
      <div class="company-info">
        <h1>Veenza Drinking Water Pvt. Ltd.</h1>
        <p>Govindgarh, Pushkar ke pass, Ajmer - 305201</p>
        <p>Pure Water, Healthy Life</p>
      </div>
    </div>
    <div>
      <span class="menu-icon" onclick="toggleMenu()">☰</span>
      <div id="dropdown-menu" class="dropdown-content">
        <a href="#" onclick="showTrackOrder()">Track Order</a>
        <a href="#" onclick="showAdminPanel()">Owner's Order List</a>
      </div>
      <a class="whatsapp-button" href="https://wa.me/917976065034" target="_blank">Chat on WhatsApp</a>
    </div>
  </header>  <div class="container" id="main-content">
    <h2>Welcome to Veenza Water Order Page</h2>
    <p>Place your water order now.</p>
    <!-- Order form and dynamic content goes here -->
  </div>  <script>
    function toggleMenu() {
      const menu = document.getElementById('dropdown-menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function showTrackOrder() {
      document.getElementById('main-content').innerHTML = `
        <h2>Track Your Order</h2>
        <p>Feature coming soon.</p>
      `;
    }

    function showAdminPanel() {
      const password = prompt("Enter owner's password:");
      if (password !== 'admin123') {
        alert('Wrong password');
        return;
      }

      // Simulated order list
      const orders = [
        { name: 'Rahul', address: 'Ajmer', amount: '₹120', status: 'Pending' },
        { name: 'Priya', address: 'Pushkar', amount: '₹240', status: 'Delivered' }
      ];

      let html = `<h2>Owner's Order List</h2><table><tr><th>Name</th><th>Address</th><th>Amount</th><th>Status</th></tr>`;
      orders.forEach(order => {
        html += `<tr><td>${order.name}</td><td>${order.address}</td><td>${order.amount}</td><td>${order.status}</td></tr>`;
      });
      html += `</table>`;
      document.getElementById('main-content').innerHTML = html;
    }
  </script></body>
</html>
